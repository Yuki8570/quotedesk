<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话回放 · 报价单系统设计与开发</title>
<style>
:root{
  --bg:#FAF9F5; --side:#F3F1EA; --line:#E6E2D6; --line2:#DCD7C9; --text:#1F1E1B; --muted:#7A766C;
  --accent:#D97757; --accent-d:#C2613F; --bubble:#EFEDE5; --code:#F5F3EC; --ok:#3F9B5E; --err:#C94F4F; --card:#FFFFFF;
  font-family: "Inter","SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--text); font-size:15px;
}
*{box-sizing:border-box} html,body{margin:0;height:100%} body{background:var(--bg)}
a{color:var(--accent-d)} button{font:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,"PingFang SC",monospace}

.app{display:grid;grid-template-columns:272px 1fr;grid-template-rows:100%;height:100vh;overflow:hidden}
/* 侧栏 */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;overflow:hidden}
.logo{display:flex;align-items:center;gap:9px;font-weight:650;font-size:16px;padding:4px 8px 14px}
.spark{color:var(--accent);font-size:20px;line-height:1}
.newbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 12px;color:var(--text);margin-bottom:16px}
.side h4{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.05em;margin:12px 8px 6px}
.sess{display:block;padding:9px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-size:13.5px;line-height:1.35}
.sess small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sess.on{background:#E8E4D8}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 2px;display:flex;align-items:center;gap:10px;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:#3a3833;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}

/* 主区 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(250,249,245,.92);backdrop-filter:blur(6px);flex:none}
.top-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:4px 9px;font-size:12.5px;color:#4a473f;white-space:nowrap}
.grow{flex:1}
.tbtn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:13.5px;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.tbtn:hover{background:#f6f4ee}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.primary:hover{background:var(--accent-d)}
.scroll{flex:1;min-height:0;overflow:auto}
.col{max-width:820px;margin:0 auto;padding:28px 24px 120px}

/* 消息 */
.unit{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.hidden{display:none !important}
.u-wrap{display:flex;flex-direction:column;align-items:flex-end;margin:30px 0 22px}
.u-bubble{background:var(--bubble);border-radius:16px;padding:12px 16px;max-width:88%;white-space:pre-wrap;line-height:1.65}
.u-time{font-size:12px;color:var(--muted);margin-top:6px}
.att{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:8px}
.att-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:#fff;border-radius:12px;padding:9px 12px;min-width:220px}
.att-ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.att-card b{display:block;font-size:13.5px;font-weight:600}
.att-card span{font-size:12px;color:var(--muted)}

.a-head{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:6px 0 10px}
.a-head .spark{font-size:18px}
.md{line-height:1.75;margin:6px 0 14px}
.md p{margin:0 0 10px}
.md h2{font-size:17px;margin:20px 0 8px}
.md h3{font-size:15.5px;margin:16px 0 6px}
.md ul,.md ol{margin:4px 0 12px;padding-left:24px}
.md li{margin:3px 0}
.md li.sub{list-style:circle;margin-left:18px}
.md code{background:var(--code);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.9em}
.md table{border-collapse:collapse;margin:8px 0 14px;font-size:14px;width:100%}
.md th,.md td{border:1px solid var(--line2);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:#F1EEE5}

.tool{border:1px solid var(--line);background:var(--card);border-radius:10px;margin:6px 0;overflow:hidden}
.tool-row{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;user-select:none;font-size:13.5px}
.tool-row:hover{background:#fbfaf6}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.tool.err .dot{background:var(--err)}
.tname{font-weight:600}
.tdesc{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.caret{color:var(--muted);transition:transform .15s;font-size:11px}
.tool.open .caret{transform:rotate(90deg)}
.tool-body{display:none;border-top:1px solid var(--line);background:var(--code);padding:10px 14px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.tool.open .tool-body{display:block}
.tool-body .cmd{color:#5b574d;margin-bottom:6px}
.tool-body .cmd::before{content:"$ ";color:var(--accent)}
.tool.err .tool-body .out{color:var(--err)}
.tool-img{padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.tool-img img{max-width:100%;border-radius:6px;border:1px solid var(--line);display:block}

.todo{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13.5px}
.todo-t{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.todo-i{display:flex;align-items:center;gap:9px;padding:3px 0}
.box{width:15px;height:15px;border:1.5px solid #b9b4a6;border-radius:4px;display:grid;place-items:center;font-size:10px;color:#fff;flex:none}
.todo-i.done .box{background:var(--ok);border-color:var(--ok)}
.todo-i.done span{color:var(--muted);text-decoration:line-through}
.todo-i.active .box{border-color:var(--accent);box-shadow:inset 0 0 0 3px #fff;background:var(--accent)}
.todo-i.active span{font-weight:600}

.figure{margin:12px 0 16px}
.figure img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;box-shadow:0 2px 12px rgba(40,30,10,.06);cursor:zoom-in}
.figure figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center}
.files{margin:10px 0 14px}
.files-cap{font-size:13px;color:var(--muted);margin-bottom:8px}
.files-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.working{display:flex;align-items:center;gap:8px;color:var(--accent-d);font-size:13.5px;margin:10px 0}
.working .spark{display:inline-block;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 输入框 */
.composer{position:relative;margin-top:-70px;padding:0 24px 18px;background:linear-gradient(transparent,var(--bg) 30%);flex:none}
.cbox{max-width:820px;margin:0 auto;border:1px solid var(--line2);background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 18px rgba(40,30,10,.06)}
.cbox .ph{color:#a8a397;font-size:14.5px;padding:2px 2px 12px}
.cbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.send{width:30px;height:30px;border-radius:9px;background:#e9c6b8;color:#fff;border:0;display:grid;place-items:center}

/* 播放控制 */
.player{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1F1E1B;color:#fff;border-radius:12px;padding:8px 10px;display:none;align-items:center;gap:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:20}
.player.on{display:flex}
.player button{background:#34322d;border:0;color:#fff;border-radius:8px;padding:6px 11px}
.player button:hover{background:#45423b}
.player .pg{min-width:70px;text-align:center;color:#d9d5ca}
.lightbox{position:fixed;inset:0;background:rgba(20,18,14,.8);display:none;place-items:center;z-index:40;padding:30px;cursor:zoom-out}
.lightbox.on{display:grid}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.top-title{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="spark">✻</span>Claude Code</div>
    <button class="newbtn"><span>＋</span>新会话</button>
    <h4>项目 · 报价单制作</h4>
    <a class="sess on" href="#">报价单系统设计与开发<small>今天 · Yuki8570/quotedesk</small></a>
    <h4>最近</h4>

    <div class="side-foot"><div class="av">Y</div><div><div style="font-weight:600">Yuki8570</div><div style="color:var(--muted);font-size:12px">对话回放 · 静态页面</div></div></div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="top-title">报价单系统设计与开发</div>
      <span class="chip">⎇ Yuki8570/quotedesk · main</span>

      <div class="grow"></div>

</div>

</div>

<script>
const TURNS = [{"role": "user", "time": "11:25", "text": "我需要制作一个业务报价单制作在线导出Excel和PDF的网站，需要实现以下功能\n\n1. 集成产品库的基础数据，产品名称、质保、产品图片、产品型号，指导价格\n2. 集成品牌模板功能，可以选择抬头，不同抬头LOGO、公司名称、电话、web、主题色都不一样\n3. 报价单制作界面，可以选择产品库里面的产品，弹窗选择，弹窗可以搜索，选择产品后导入产品信息、图片等\n4. 报价单制作导入，导入后也可以手动修改信息\n5. 如果不导入，收到填写报价单信息的话，填写信息后，可以上传到产品基础数据里面\n6. 基础模板保存功能，可以保存常用模板，后面可以基于这个模板进行修改。\n7. 具备导出pdf和excel的功能，excel格式要和我上传的格式一模一样\n\n这个项目你明白了，建议用什么方式实现", "att": []}, {"role": "assistant", "blocks": [{"t": "tool", "name": "Bash", "desc": "Check for uploaded files", "cmd": "ls -la /mnt/user-data/uploads 2>/dev/null; ls -la /home/claude", "out": "total 44\ndrwxr-xr-x 9 claude claude 4096 Nov  2 11:25 .\n-rw-r--r-- 1 claude claude  398 Oct 31 04:19 .gitconfig\n…", "err": false, "img": null}, {"t": "text", "md": "明白你的需求：这是一个**报价单管理系统**，包括产品库、品牌抬头、报价单编辑器、常用模板，以及严格按样式导出 Excel 和 PDF。\n\n先说一点：**我这边没收到你上传的 Excel 文件**，可能上传时漏掉了。第 7 条\"格式一模一样\"是整个项目里最难的部分，技术方案要看这个文件来定，麻烦再传一次。\n\n## 推荐方案\n\n**前后端分离的 Web 应用 + 数据库**。不建议做成纯前端单页，因为产品库、模板和报价记录要多人共享，还要长期保存。\n\n| 层 | 推荐技术 | 理由 |\n|---|---|---|\n| 前端 | React + Ant Design（或 Vue3 + Element Plus） | 中文后台组件成熟，弹窗搜索选择、可编辑表格、图片上传都是现成的 |\n| 后端 | Node.js（NestJS / Express），或 Python（FastAPI） | 两者都能做 Excel 和 PDF 生成 |\n| 数据库 | PostgreSQL 或 MySQL；小团队用 SQLite 也够 | 存产品、品牌、报价单、模板 |\n| 图片存储 | 阿里云 OSS / 腾讯云 COS，初期也可以存本地磁盘 | 产品图和 LOGO |\n| 部署 | 国内云服务器 + Docker | 访问快，也方便以后迁移 |\n\n## 两个关键难点怎么做\n\n**1. Excel 和你的格式一模一样**\n- 做法是**拿你的 Excel 当模板文件直接往里填**，而不是用代码从零画表格。这样字体、边框、合并单元格、列宽、打印设置都能原样保留。\n- 用 ExcelJS（Node）或 openpyxl（Python）打开模板，填抬头区（LOGO、公司名、电话、网址、主题色），产品行按模板样式动态插入，图片嵌进对应单元格，合计行自动下移。\n- 要注意：如果模板里有形状、文本框或图表，这些库可能保留不全。看到文件后我可以先确认。如果真有这种情况，换成 Java 的 Apache POI，兼容性最好。\n\n**2. PDF**\n有两种做法：\n- **从 Excel 转 PDF**（服务器上用 LibreOffice）：PDF 和 Excel 长得完全一致，维护一份模板就够。如果你要求两者一致，推荐这种。\n- **单独用 HTML 渲染出 PDF**（Playwright）：排版更自由、更好看，但要维护两套样式。\n\n## 数据结构（简化）\n\n- **产品库**：名称、型号、质保、图片、指导价\n- **品牌抬头**：LOGO、公司名、电话、网址、主题色\n- **报价单**：选用的抬头、客户信息、日期、明细行、备注、合计\n- **报价明细**：从产品库导入后，保存的是**一份副本**，所以改报价单不会改到产品库；手动填的行可以点\"保存到产品库\"（对应你的第 5 条）\n- **常用模板**：保存一份报价单结构，以后\"基于模板新建\"\n\n## 建议的开发顺序\n\n1. 产品库和品牌抬头的增删改查\n2. 报价单编辑器：弹窗搜索选产品、手动修改、手动添加的行回存产品库\n3. Excel 导出（按你的模板对齐）\n4. PDF 导出\n5. 常用模板保存与复用\n6. （可选）登录和权限、报价单历史和查询、导出记录\n\n## 需要你确认几件事\n\n1. **重新上传 Excel 模板**（最好再附一张你想要的 PDF 效果截图）\n2. **使用人数**：只有你自己，还是团队多人用？需不需要登录、区分权限？\n3. **部署位置**：有现成的服务器或域名吗？还是想先在本地电脑上跑起来？\n4. 有没有**税率、币种、折扣**之类的计算规则？\n\n你把 Excel 传上来以后，我可以先在这里搭一个**能跑的原型**，包括产品库、抬头切换、报价单编辑和导出，你试用后再调整。"}]}, {"role": "user", "time": "11:32", "text": "@\"/mnt/user-data/uploads/b99fdaca-25.2.14_12kW_solar_system.xlsx\" 1. 这是我们在用的Excel报价模板，要求格式一模一样\n2. 公司内部使用，40-50人，但前期作成纯前端应用，为了方便早会演示\n3. 部署到本地服务器，后期局域网使用\n4. 没有税率、币种、折扣之类的计算规则\n5. 第二张图是我想要的前端UI风格", "att": [{"type": "file", "name": "25.2.14_12kW_solar_system.xlsx", "meta": "Excel"}, {"type": "image", "name": "image.png", "meta": "参考 UI 截图"}]}, {"role": "assistant", "blocks": [{"t": "text", "md": "我先仔细分析你的 Excel 模板结构，然后按截图的界面风格做一个纯前端的可运行原型。"}, {"t": "tool", "name": "Bash", "desc": "Unpack Excel template to inspect", "cmd": "mkdir -p /home/claude/src && cp …/25.2.14_12kW_solar_system.xlsx /home/claude/src/template.xlsx && cd /home/claude/src && mkdir x && cd x && unzip -o -q ../template.xlsx && find . -type f | xargs ls -la", "out": "-rw-r--r-- 1 root root    1566 [Content_Types].xml\n-rw-r--r-- 1 root root    3920 ./xl/drawings/drawing1.xml\n-rw-r--r-- 1 root root   18881 ./xl/media/image1.png\n-rw-r--r-- 1 root root 7427884 ./xl/media/image2.png\n-rw-r--r-- 1 root root  874560 ./xl/media/image3.png\n-rw-r--r-- 1 root root  381607 ./xl/media/image4.png\n-rw-r--r-- 1 root root  135234 ./xl/media/image5.jpeg\n-rw-r--r-- 1 root root    1891 ./xl/sharedStrings.xml\n-rw-r--r-- 1 root root   38774 ./xl/styles.xml\n-rw-r--r-- 1 root root  706525 ./xl/worksheets/sheet1.xml", "err": false, "img": null}, {"t": "tool", "name": "Bash", "desc": "Inspect strings, drawings, sheet header", "cmd": "cat xl/sharedStrings.xml; cat xl/drawings/drawing1.xml; cat xl/workbook.xml; head -c 4000 xl/worksheets/sheet1.xml", "out": "<si><t tyle mismatches: 0\nidentical parts: ['xl/styles.xml', 'xl/theme/theme1.xml', 'xl/workbook.xml', '[Content_Types].xml', 'docProps/app.xml']", "err": false, "img": null}, {"t": "tool", "name": "Read", "desc": "/home/claude/out/fincrop.png", "cmd": "", "out": "", "err": false, "img": "img/r_fincrop.jpg"}, {"t": "tool", "name": "Write", "desc": "/home/claude/app/README.md", "cmd": "", "out": "File created successfully", "err": false, "img": null}, {"t": "tool", "name": "Bash", "desc": "Package deliverables", "cmd": "mkdir -p deliver && cp app/dist/index.html \"deliver/报价单系统.html\" && … zip -qr \"../deliver/报价单系统_源码.zip\" src build.mjs README.md", "out": "-rw-r--r-- 1 root root 1212229 报价单系统.html\n-rw-r--r-- 1 root root  204858 报价单系统_源码.zip\n-rw-r--r-- 1 root root  397657 示例导出_25.2.14_12kW_solar_system.pdf\n-rw-r--r-- 1 root root  275235 示例导出_25.2.14_12kW_solar_system.xlsx", "err": false, "img": null}, {"t": "tool", "name": "TaskUpdate", "desc": "#5 → completed", "cmd": "", "out": "Updated task status", "err": false, "img": null}, {"t": "todo", "items": [["准备模板与示例数据", 1], ["实现Excel导出引擎（基于原模板XML）", 1], ["实现PDF/预览渲染", 1], ["搭建前端界面", 1], ["验证导出结果与界面", 1]]}, {"t": "files", "files": ["报价单系统.html", "示例导出_25.2.14_12kW_solar_system.xlsx", "示例导出_25.2.14_12kW_solar_system.pdf", "报价单系统_源码.zip"], "cap": "报价单系统：下载后双击 HTML 即可使用，不需要联网。另附两份示例导出文件和源码。"}, {"t": "tool", "name": "Projects", "desc": "project_write · 报价单系统_方案与进度.md", "cmd": "", "out": "{\"path\":\"claude/报价单系统_方案与进度.md\",\"replaced\":false}", "err": false, "img": null}, {"t": "text", "md": "系统做好了：`报价单系统.html` 是一个单独的文件，双击用 Chrome 或 Edge 打开就能用，不需要联网。里面已经放好了你模板里的 4 个产品、SunEvo 抬头、一个常用模板和一张示例报价单，早会可以直接演示。以后部署到局域网，把这个文件改名为 `index.html`，放到 Nginx 或 IIS 的网站目录就行。\n\n**Excel 格式**：导出时直接在你的原始模板上填数据，没有重新画表格。我把示例导出文件和你的原文件逐项对比过，约 4.9 万个单元格的样式、行高、合并单元格、列宽、¥ 金额格式、A4 打印设置（60% 缩放）都一致，D×E 和 SUM 公式也保留了。换抬头时，LOGO、公司名、电话、网址和表头颜色会跟着变。产品数量不固定，增减产品时合计行和条款会自动上下移动。附带的两份示例文件可以直接和原表对比。\n\n**7 项需求的对应情况：**\n1. **产品库**：存名称、质保、图片、型号、指导价，另外加了分类。\n2. **品牌抬头**：每个抬头单独设置 LOGO、公司名、电话、网址、邮箱、主题色和辅助色，可以设一个默认抬头。\n3. **从产品库选择**：弹窗里能搜索、按分类筛选、一次多选，导入后带上图片和全部信息。\n4. **导入后修改**：每一行都能改。改过的行会标出\"已修改\"，可以把修改同步回产品库，也可以恢复成产品库原来的数据。\n5. **手动录入**：手动添加的行标为\"手动录入\"，点\"存入产品库\"就能加进去。\n6. **常用模板**：可以存为模板，之后用模板新建报价单，模板本身也能编辑。\n7. **导出**：Excel 和 PDF 都能导出。编辑页右侧有实时预览，分页位置和 Excel 打印时一样。\n\n**需要知道的两点限制：**\n- **数据只存在本机浏览器里。** 目前每个人的数据是分开的。同事之间可以在「数据备份」里导出产品库、抬头和模板，对方选\"合并导入\"就能用。清理浏览器数据前要先导出备份。正式给 40–50 人共用，需要二期加上后端和数据库。源码已经按这个方向分好了，只需要替换存储那一部分。\n- **PDF 里的文字不能选中复制。** PDF 是按 Excel 版式画成图片再生成的，好处是排版和 Excel 完全一致，打印、发给客户都没问题。\n\n**两份示例数据：**\n- 第二个抬头「示例品牌 Voltera」是我编的，只用来演示切换抬头，正式使用前请删掉，或者换成你们真实的抬头。\n- 产品图片在导入时会压缩到最长边 900 像素以内，所以导出的 Excel 比原文件小得多。原文件里有一张 7MB 的图。\n\n方案说明和二期建议已经保存到这个项目的文档里。"}]}, {"role": "user", "time": "15:21", "text": "帮我上传到github，可以直接外网访问", "att": []}, {"role": "assistant", "blocks": [{"t": "text", "md": "I'll put the app into a new GitHub repo and turn on GitHub Pages so it can be opened from the public internet. Checking the GitHub login first."}, {"t": "tool", "name": "Bash", "desc": "Check GitHub CLI authentication", "cmd": "gh auth status 2>&1 | head; gh api user --jq '.login' 2>&1", "out": "github.com\n  X Failed to log in to github.com using token (GH_TOKEN)\n{\"message\":\"No linked GitHub account. Connect your GitHub account at …\"}", "err": true, "img": null}, {"t": "tool", "name": "Bash", "desc": "Prepare local git repository for GitHub Pages", "cmd": "R=/home/claude/repo; … git init -q -b main && git add -A && git commit -qm \"QuoteDesk 报价单系统：纯前端版本\"", "out": "e4c7cd7 QuoteDesk 报价单系统：纯前端版本\n.  ..  .git  .gitignore  .nojekyll  README.md  build.mjs  index.html  src", "err": false, "img": null}, {"t": "text", "md": "还没上传成功：这个会话里没有关联你的 GitHub 账号，所以我现在没有权限建仓库、推代码。\n\n**你需要做一步：** 打开下面的链接，授权 GitHub，然后回到这里回复\"好了\"：\nhttps://claude.ai/customize/connectors?auth_start=github…\n\n代码我已经整理好了，授权之后可以直接推送。网站本体放在仓库根目录的 `index.html`，旁边是源码和部署说明。\n\n授权后我会这样做（有不同意见请在回复时一起说）：\n\n1. 在你的账号下新建一个仓库，名字叫 `quotedesk`，把代码推上去。\n2. 开启 GitHub Pages。大约 1–2 分钟后，外网 const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s（(：:])(https?:\/\/[^\s<）)，。、]+)/g, (m,a,u)=> `${a}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  return s;
}
function md(src){
  const lines = src.split('\n'); let out=''; let i=0;
  while(i<lines.length){
    const l = lines[i];
    if(!l.trim()){ i++; continue; }
    let m;
    if((m=/^(#{1,3})\s+(.*)/.exec(l))){ const n=Math.max(2,m[1].length); out+=`<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if(l.trim().startsWith('|')){
      const rows=[]; while(i<lines.length && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const cells = r => r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><thead><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>';
      rows.slice(2).forEach(r=> out+='<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>');
      out+='</tbody></table>'; continue;
    }
    if(/^\s*(-|\d+\.)\s+/.test(l)){
      const ordered = /^\d+\./.test(l.trim()); const tag = ordered?'ol':'ul';
      out+=`<${tag}>`;
      while(i<lines.length && /^\s*(-|\d+\.)\s+/.test(lines[i])){
        const sub = /^\s{2,}/.test(lines[i]);
        out+=`<li${sub?' class="sub"':''}>${inline(lines[i].replace(/^\s*(-|\d+\.)\s+/,''))}</li>`; i++;
      }
      out+=`</${tag}>`; continue;
    }
    const para=[]; while(i<lines.length && lines[i].trim() && !/^(#{1,3}\s|\s*\||\s*(-|\d+\.)\s)/.test(lines[i])){ para.push(inline(lines[i])); i++; }
    out+=`<p>${para.join('<br>')}</p>`;
  }
  return out;
}
const FILE_ICON = n => n.endsWith('.xlsx')?['XLS','#1D7A45']:n.endsWith('.pdf')?['PDF','#C9443A']:n.endsWith('.zip')?['ZIP','#7A6A4F']:n.endsWith('.html')?['HTML','#D97757']:['FILE','#888'];
function fileCard(name, meta){ const [t,c]=FILE_ICON(name); return `<div class="att-card"><div class="att-ico" style="background:${c}">${t}</div><div><b>${esc(name)}</b><span>${esc(meta||'')}</span></div></div>`; }

const player=document.getElementById('player'), pg=document.getElementById('pg'), scroller=document.getElementById('scroll');
let step=-1, playing=false;

function render(){

  working.remove();
  if(playing && step < units.length-1 && !units[step+1].querySelector('.u-wrap')) units[step].after(working);
  pg.textContent = `${step+1} / ${units.length}`;
  if(playing && units[step]){
    const t = units[step];
    requestAnimationFrame(()=>{
      const r = t.getBoundingClientRect(), sr = scroller.getBoundingClientRect();
      const bottom = r.bottom - sr.top + scroller.scrollTop;            // 单元底部在滚动内容中的位置
      const top = r.top - sr.top + scroller.scrollTop;
      let target = bottom - scroller.clientHeight + 150;                // 让新内容底部露出，避开输入框
      if (r.height > scroller.clientHeight - 200) target = top - 80;    // 很长的内容从顶部开始看
      scroller.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    });
  }
}
function play(){ playing=true; step=0; player.classList.add('on'); scroller.scrollTop=0; render(); }
function stop(){ playing=false; player.classList.remove('on'); render(); }
function next(){ if(step<units.length-1){ step++; render(); } }
function prev(){ if(step>0){ step--; render(); } }

  if(lb.classList.contains('on') && e.key==='Escape'){ lb.classList.remove('on'); return; }
  if(!playing) return;
  if(['ArrowRight',' ','Enter','PageDown'].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Escape') stop();
});
if(location.hash==='#play') play(); else render();
</script>
</body>
</html>
